<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winone Pakistan</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🇵🇰 Winone Pakistan</h1>
  <p>Win Amazing Prizes</p>
</header>

<main>

  <div class="prize-card">

    <div class="phone-image">📱</div>

    <h2>Win a New Mobile</h2>

    <p class="prize-text">Lucky Mobile Draw</p>

    <div class="countdown">
      <h3>⏳ Draw Countdown</h3>
      <p id="timer">24:00:00</p>
    </div>

    <div class="stats">
      <div>
        <b id="entries">0</b>
        <small>Total Entries</small>
      </div>

      <div>
        <b>1</b>
        <small>Rupee Entry</small>
      </div>
    </div>

    <button onclick="enterDraw()">
      ENTER NOW — Rs. 1
    </button>

    <p id="message"></p>

  </div>

</main>

<footer>
  <p>© 2026 Winone Pakistan</p>
  <p>Demo Version</p>
</footer>

<script>
let entries = 0;

function enterDraw() {
  entries++;
  document.getElementById("entries").innerText = entries;

  document.getElementById("message").innerText =
    "🎟️ Demo entry added successfully!";
}

let seconds = 24 * 60 * 60;

function updateTimer() {
  let hours = Math.floor(seconds / 3600);
  let minutes = Math.floor((seconds % 3600) / 60);
  let secs = seconds % 60;

  document.getElementById("timer").innerText =
    String(hours).padStart(2, "0") + ":" +
    String(minutes).padStart(2, "0") + ":" +
    String(secs).padStart(2, "0");

  if (seconds > 0) {
    seconds--;
  }
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
